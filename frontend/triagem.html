<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Triagem</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">

  <!-- Cabeçalho com botão da TV -->
  <div class="triagem-cabecalho">
   <h2>🏥 Triagem Hospitalar</h2>
   <button class="btn-abrir-tv"
   onclick="window.open('tv.html','_blank')">📺
   Abrir Tela da TV</button>
  </div>

  <!-- Fila de pacientes do Atendimento criada para mostrar
    quem pode ser chamado na TV -->
  <div class="pacientes-fila">
    <h3>
      Pacientes Cadastros no Atendimento
      <span>Clique em "Chamar na TV" para
        chamar ao guichê</span>
    </h3>
    <div id="fila-pacientes">
      <p class="texto-secundario fila-carregando">Carregando...</p>
    </div>
    <button class="btn-atualizar" onclick="carregarPacientes()">
        🔄️
        Atualizar
        lista</button>
  </div>
  <input id="nome" placeholder="Nome">

<select id="sintoma">

<option value="">Selecione</option>
<option value="dor_leve">Dor leve</option>
<option value="resfriado">Resfriado</option>
<option value="coriza">Coriza</option>
<option value="tosse">Tosse</option>
<option value="febre">Febre</option>
<option value="vomito">Vômito</option>
<option value="diarreia">Diarreia</option>
<option value="falta_ar_moderada">Falta de ar moderada</option>
<option value="falta_ar_grave">Falta de ar grave</option>
<option value="infarto">Suspeita de infarto</option>
<option value="avc">Suspeita de AVC</option>
<option value="convulsao">Convulsão</option>
<option value="hemorragia">Hemorragia</option>

</select>

<input
  id="temp"
  type="number"
  placeholder="Temperatura"
/>

<input
  id="alergia"
  placeholder="Alergias"
/>

<textarea
  id="observacao"
  placeholder="Observações"
></textarea>

<div id="resultado"></div>

<button id="salvar-triagem" onclick="salvar()">
Salvar Triagem
</button>

</div>

<script>

function classificarRisco(sintoma, temperatura){

  const vermelhos = [
    "infarto",
    "avc",
    "convulsao",
    "hemorragia",
    "falta_ar_grave"
  ];

  const amarelos = [
    "febre",
    "vomito",
    "diarreia",
    "falta_ar_moderada"
  ];

  if (temperatura >= 39) {
    return "vermelho";
  }

  if (vermelhos.includes(sintoma)) {
    return "vermelho";
  }

  if (amarelos.includes(sintoma)) {
    return "amarelo";
  }

  return "verde";
}

async function salvar(){

  const nome =
    document.getElementById("nome").value.trim();

  const sintoma =
    document.getElementById("sintoma").value;

  const temperaturaInformada =
    document.getElementById("temp").value;
  const temperatura =
    temperaturaInformada === "" ? null : Number(temperaturaInformada);

  const alergia =
    document.getElementById("alergia").value;

  const observacao =
    document.getElementById("observacao").value;

  const risco =
    classificarRisco(sintoma, temperatura);

  const resultado = document.getElementById("resultado");
  const botaoSalvar = document.getElementById("salvar-triagem");

  if (!nome) {
    resultado.className = "";
    resultado.textContent = "Informe o nome do paciente para salvar a triagem.";
    return;
  }

  botaoSalvar.disabled = true;
  resultado.className = "";
  resultado.textContent = "Salvando triagem...";

  try {
    const resposta = await fetch("/triagem", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        nome,
        sintoma,
        temperatura,
        alergia,
        observacao,
        risco
      })
    });
    const dados = await resposta.json();

    if (!resposta.ok) {
      throw new Error(dados.erro || "Não foi possível salvar a triagem.");
    }

    resultado.className = risco;
    resultado.textContent = `Triagem salva no banco de dados. Classificação: ${risco.toUpperCase()}`;
  } catch (erro) {
    resultado.className = "";
    resultado.textContent = `Erro ao salvar a triagem: ${erro.message}`;
  } finally {
    botaoSalvar.disabled = false;
  }

}

</script>

</body>
</html>
