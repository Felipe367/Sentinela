<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - cadastro Simples</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
<div class="container">
  <a href="index.html" style="text-decoration:none; color: #3498db;
  font-size:14px; display: incline-block;
  margin-bottom:12px;"> Voltar para login</a>
  <h2>👤Cadastrar Usuário</h2>
   
  <form id="formUsuario">
    <input type="text" id="usuario" placeholder="Nome de Usuário 
    (Login)" required>
    <input type="password" id="senha" placeholder="Senha" required>

    <select id="tipo" required>
        <option value="">Selecione</option>
        <option value="atendimento">atendimento</option>
        <option value="triagem">Triagem</option>
        <option value="medico">Médico</option>
    </select>

    <button type="submit">cadastrar Usuário</button>
  </form>

  <hr style="margin: 25px 0; border: none; border-top: 1px solid #ccc;">

  <h3>Usuários Cadastrados</h3>
  <div id="listaUsuarios"></div>
 </div>

 <script>
   // 1. Cadastrar usuário ao enviar o formulário
    document.getElementById("formUsuario").addEventListener("submit", function(e) {
        e.preventDefault();

        const usuário = document.getElementById("usuário").value;
        const senha = document.getElementById("senha").value;
        const tipo = document.getElementById("tipo").value;

        fetch("/usuarios", {
            method:"POST",
            headers: { "Content-Type": "applocation/json" },
            body: JSON.stringify({ usuario, senha, tipo })
        })
        .then(res => res.json())
        .then(dados => {
            if (dados.erro) {
                alert("Erro: " + dados.erro);
            } else {
                alert("Usuário cadastrado com sucesso!");
                document.getElementById("formUsuario").reset();
                carregarUsuario();
            }
        });
    });

    // 2. Carregar e listar os usuraios cadastrados
    function carregarUsuarios() {
        fetch("/usuarios")
        .then(res => res.json())
        .then(usuarios => {
            const div = document.getElementById
            ("listaUsuarios");
            div.innerHTML = "";


            usuarios.forEach(u => {
              div.innerHTML += `
                <div class="card">
                  <b>Usuários:</b> ${u.usuario} |
                   <b>Setor:</b> ${u.tipo}
                </div>
              `;
            });
        });
    }

    // Carregar a lista automaticamente ao abrir a página
    carregarUsuarios();
 </script>
 
</body>
</html>
